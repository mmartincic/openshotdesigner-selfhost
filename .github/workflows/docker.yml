name: Docker image

# Builds the self-hosted image and publishes it to the GitHub Container
# Registry as ghcr.io/<owner>/<repo> (lowercased). TrueNAS pulls it from there.
#
# Runs on every push to main, on version tags (v1.2.3 → :1.2.3), and by hand
# from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GHCR only accepts lowercase names; repos like "OpenShotDesigner" are not.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`${{ steps.name.outputs.image }}:latest\`"
            echo ""
            echo "TrueNAS → Apps → your app → Edit → Save (with pull policy *Always pull*) to update."
          } >> "$GITHUB_STEP_SUMMARY"
